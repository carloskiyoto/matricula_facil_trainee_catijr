# Nome do projeto
spring.application.name=matricula_facil

#ENDEREÇO DO BANCO DE DADOS
spring.datasource.url=jdbc:postgresql://localhost:5432/matricula_facil_db

#O USUÁRIO E A SENHA (chaves definidas no docker
spring.datasource.username=postgres
spring.datasource.password=senha

#JPA (O ORM)
#Se as tabelas não existirem no banco, crie elas automaticamente para mim!"
spring.jpa.hibernate.ddl-auto=create    

# Mostra no terminal os comandos SQL
spring.jpa.show-sql=true